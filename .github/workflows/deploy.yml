# 自动构建并部署 rk6006h-web-console 到 GitHub Pages（Chromium 浏览器访问，Web Bluetooth 需 HTTPS）。
# 文档：https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages
#
# 部署地址：https://<owner>.github.io/<repo>/
# 本仓库：https://wonder1031.github.io/RK6006H-web/
#
# 前置条件（一次性设置）：
#   仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#
# 注意：仓库根是 monorepo（含协议文档/分析脚本/上位机），web 上位机在子目录
#       rk6006h-web-console/，所有 npm/build 步骤用 working-directory 切进去。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'rk6006h-web-console/src/**'
      - 'rk6006h-web-console/public/**'
      - 'rk6006h-web-console/index.html'
      - 'rk6006h-web-console/package.json'
      - 'rk6006h-web-console/package-lock.json'
      - 'rk6006h-web-console/tsconfig.json'
      - 'rk6006h-web-console/vite.config.ts'
      - 'rk6006h-web-console/tailwind.config.js'
      - 'rk6006h-web-console/postcss.config.js'
      - '.github/workflows/deploy.yml'
  # 支持手动触发（Actions → Run workflow）
  workflow_dispatch:

# GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支并发推送时，取消旧的运行，只部署最新版本
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rk6006h-web-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # package-lock.json 在子目录，需明确告知 cache 插件
          cache-dependency-path: 'rk6006h-web-console/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # 自动检测仓库类型并输出 base_path（本仓库 = /RK6006H-web/）

      - name: Build
        # Vite 会读取环境变量 base_path 作为构建 base，
        # 若未注入则回退到 vite.config.ts 的默认值。
        # 不用 --base 而是改用环境变量传参，避免 shell 对路径参数的转译干扰。
        env:
          base_path: ${{ steps.pages.outputs.base_path }}
        run: npx vite build --base "$base_path"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload-pages-artifact 的 path 相对于仓库根，不是 working-directory
          path: rk6006h-web-console/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
