<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="RK6006H 直流电源 Web 上位机（Web Bluetooth + Modbus RTU）"
        />
        <title>RK6006H Web 上位机</title>
        <!-- 首帧防闪烁：在 CSS 加载前就确定主题。
             值以 JSON 字符串形式存储（与 utils/storage.ts 一致：JSON.stringify('light')='"light"'）。
             优先级：已保存选择 > 系统偏好 > 深色。 -->
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem("rk6006h:theme");
                    var t = raw ? JSON.parse(raw) : null;
                    if (t !== "light" && t !== "dark") {
                        t =
                            window.matchMedia &&
                            window.matchMedia("(prefers-color-scheme: light)")
                                .matches
                                ? "light"
                                : "dark";
                    }
                    document.documentElement.dataset.theme = t;
                } catch (e) {
                    document.documentElement.dataset.theme = "dark";
                }
            })();
        </script>
    </head>
    <body class="bg-surface text-ink antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
